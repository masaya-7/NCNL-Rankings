<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blitz Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column — header, ranked ladder, footnote. */
/* ===== EDIT YOUR PLAYERS IN THE <script> BELOW, NOT HERE ===== */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#17201b; --muted:#5f6b63;
  --line:#dde3dc; --accent:#2f6b4a; --accent-soft:#e3eee6;
  --up:#1f7a45; --down:#b3402c; --gold:#a8791c;
  --display:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121815; --surface:#19211d; --fg:#e7ede8; --muted:#97a69c;
    --line:#2a352f; --accent:#7cc69b; --accent-soft:#1f3329;
    --up:#6fd197; --down:#f08a74; --gold:#e0b45a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--display);
  font-size:16px; line-height:1.5;
  padding-block:40px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font-size:clamp(32px,7vw,48px);line-height:1;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.controls{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
button{
  font:600 14px var(--display); color:var(--fg); background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer;
}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.6;cursor:progress}

.ladder{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:14px 18px;border-top:1px solid var(--line);
}
.row:first-child{border-top:0}
.head{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-block:10px;background:var(--bg)}
.rank{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.row.top .rank{color:var(--gold)}
.who{min-width:0}
.who a{color:var(--fg);font-weight:600;font-size:17px;text-decoration:none;overflow-wrap:anywhere}
.who a:hover{color:var(--accent);text-decoration:underline}
.meta{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.score{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.rating{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prov{color:var(--muted);font-weight:400}
.delta{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--muted)}
.row.issue .rating{font-size:13px;color:var(--muted);font-weight:400}
.pill{display:inline-block;font-size:11px;font-family:var(--mono);padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}
.msg{padding:28px 18px;color:var(--muted);text-align:center}
.foot{font-size:13px;color:var(--muted);max-width:65ch}
.foot code{font-family:var(--mono);font-size:12px}
@media (max-width:420px){ .row{grid-template-columns:32px minmax(0,1fr) auto;padding:12px 14px;gap:10px} .rating{font-size:18px} }
@media (prefers-reduced-motion:no-preference){ .row{transition:background .15s} .row:not(.head):hover{background:var(--accent-soft)} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Lichess · Blitz</p>
      <h1>Blitz Ladder</h1>
    </div>
    <div class="controls">
      <span id="updated">Loading…</span>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <section class="ladder" id="ladder" aria-live="polite">
    <div class="row head"><span>#</span><span>Player</span><span style="text-align:right">Rating</span></div>
    <div class="msg">Fetching ratings from Lichess…</div>
  </section>

  <p class="foot">
    Ratings come live from Lichess every time this page opens. The small number under each rating is the
    player's change over their last 12 blitz games. A <code>?</code> means the rating is still provisional.
  </p>
</div>

<script>
/* ============ EDIT THIS LIST to add or remove players (up to 300) ============ */
const PLAYERS = [
  "Masaya7",
  "Lizo",
  "GoldenGanglion",
  "King_Bravo",
  "Mbo_weakplayer1",
  "LawGeek",
  "Flit909",
  "LangCap",
];
/* ============================================================================ */

const ladder = document.getElementById("ladder");
const updated = document.getElementById("updated");
const btn = document.getElementById("refresh");
const HEAD = ladder.querySelector(".head").outerHTML;

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

async function load(){
  btn.disabled = true; updated.textContent = "Updating…";
  try{
    const res = await fetch("https://lichess.org/api/users", {
      method:"POST", headers:{"Content-Type":"text/plain"}, body: PLAYERS.join(",")
    });
    if(res.status === 429) throw new Error("Lichess asked us to slow down. Wait a minute, then refresh.");
    if(!res.ok) throw new Error("Lichess returned an error (" + res.status + "). Try again shortly.");
    const users = await res.json();
    render(users);
    updated.textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  }catch(err){
    ladder.innerHTML = HEAD;
    ladder.append(el("div","msg", err.message.startsWith("Lichess") ? err.message : "Couldn't reach Lichess. Check your connection and refresh."));
    updated.textContent = "Not updated";
  }finally{ btn.disabled = false; }
}

function render(users){
  const found = new Map(users.map(u => [u.id, u]));
  const rows = PLAYERS.map(name => {
    const u = found.get(name.toLowerCase());
    if(!u) return {name, issue:"Username not found"};
    if(u.disabled) return {name:u.username, issue:"Account closed"};
    if(u.tosViolation) return {name:u.username, issue:"Account flagged"};
    const b = u.perfs && u.perfs.blitz;
    if(!b || !b.games) return {name:u.username, issue:"No blitz games yet", u};
    return {name:u.username, u, rating:b.rating, prov:!!b.prov, prog:b.prog||0, games:b.games};
  });
  const rated = rows.filter(r => r.rating != null).sort((a,b) => b.rating - a.rating);
  const other = rows.filter(r => r.rating == null);

  ladder.innerHTML = HEAD;
  rated.forEach((r,i) => ladder.append(rowEl(r, i+1)));
  other.forEach(r => ladder.append(rowEl(r, null)));
}

function rowEl(r, rank){
  const row = el("div", "row" + (rank===1 ? " top" : "") + (r.issue ? " issue" : ""));
  row.append(el("span","rank", rank ? String(rank) : "–"));

  const who = el("div","who");
  const a = el("a", null, r.name);
  a.href = "https://lichess.org/@/" + encodeURIComponent(r.name);
  a.target = "_blank"; a.rel = "noopener";
  who.append(a);
  if(r.u && r.u.title) { const t = el("span","pill", r.u.title); who.append(t); }
  who.append(el("div","meta", r.issue ? r.issue : r.games.toLocaleString() + " blitz games"));
  row.append(who);

  const score = el("div","score");
  if(r.issue){ score.append(el("span","rating","—")); }
  else{
    const rt = el("span","rating", String(r.rating));
    if(r.prov) rt.append(el("span","prov","?"));
    score.append(rt);
    const d = r.prog, cls = d>0 ? "up" : d<0 ? "down" : "flat";
    score.append(el("span","delta "+cls, d>0 ? "▲ "+d : d<0 ? "▼ "+Math.abs(d) : "±0"));
  }
  row.append(score);
  return row;
}

btn.addEventListener("click", load);
load();
</script>
</body>
</html>
